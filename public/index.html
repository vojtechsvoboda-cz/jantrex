<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JANTREX · Podklady k webu</title>
<meta name="description" content="Podklady k novému webu JANTREX realizace s.r.o.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="JANTREX · Podklady k webu">
<meta property="og:description" content="Pár kroků, zhruba 15 minut. Co nevíš, přeskoč.">
<meta property="og:image" content="/og.jpg">
<meta name="theme-color" content="#0b0b0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a09;--ink:#f3efe6;--muted:#a59f92;--dim:#6f6a60;
  --gold:#c9a55c;--gold2:#e6cd8f;--gold-d:#8d7038;
  --card:rgba(22,21,19,.78);--card2:rgba(255,255,255,.035);--line:rgba(201,165,92,.20);--line2:rgba(255,255,255,.08);
  --ok:#8fc79a;--err:#e48a7a;
  --r:16px;--r-sm:11px;
  --disp:'Cinzel',Georgia,serif;--body:'Manrope',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--bg);font-size:16px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:url(/marble.jpg) center/cover no-repeat;opacity:.55}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 70% at 50% 0%,rgba(10,10,9,.55),rgba(10,10,9,.92) 60%,#0a0a09)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--gold2)}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 120px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:8px}

/* ---------- logo ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.mark{display:inline-flex;align-items:center;border:1.5px solid var(--gold);padding:5px 12px 4px;font-family:var(--disp);font-weight:600;letter-spacing:.06em;font-size:19px;line-height:1;color:#f1ede4;text-decoration:none}
.mark b{color:var(--gold);font-weight:600;font-size:1.18em;margin-left:-.02em}
.savest{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px;min-height:20px}
.savest .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.savest.ok .dot{background:var(--ok)} .savest.busy .dot{background:var(--gold);animation:pulse 1s infinite}
.savest.bad{color:var(--err)} .savest.bad .dot{background:var(--err)}
@keyframes pulse{50%{opacity:.3}}

/* ---------- stepper ---------- */
.stepper{position:sticky;top:0;z-index:20;margin:0 -18px 18px;padding:10px 18px 0;background:linear-gradient(#0a0a09 70%,rgba(10,10,9,0))}
.stp-in{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.stp-in::-webkit-scrollbar{display:none}
.stp{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:7px 12px 7px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);font-size:13.5px;font-weight:600;transition:.18s}
.stp:hover{border-color:var(--line);color:var(--ink)}
.stp-n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--card2);border:1px solid var(--line2)}
.stp-n svg.i{width:14px;height:14px}
.stp.done .stp-n{background:rgba(201,165,92,.14);border-color:var(--line);color:var(--gold2)}
.stp.active{border-color:var(--gold);color:#16130c;background:linear-gradient(135deg,var(--gold2),var(--gold))}
.stp.active .stp-n{background:rgba(0,0,0,.14);border-color:transparent;color:#16130c}
.stp-bar{height:2px;background:var(--line2);border-radius:2px;overflow:hidden}
.stp-bar b{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold2));transition:width .35s ease}

/* ---------- step ---------- */
.step{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sthead{display:flex;align-items:flex-start;gap:14px;margin:6px 0 18px}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--gold2);background:linear-gradient(160deg,rgba(201,165,92,.18),rgba(201,165,92,.04));border:1px solid var(--line)}
.kicker{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1,h2{font-family:var(--disp);font-weight:600;letter-spacing:.02em;line-height:1.15}
h1{font-size:clamp(28px,6vw,40px)}
h2{font-size:clamp(23px,4.6vw,30px)}
.lead{color:var(--muted);margin-top:6px;max-width:60ch}
.cap{font-size:13.5px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:18px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.q{margin-bottom:14px}
.qh{display:flex;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
.ql{font-weight:700;font-size:15.5px}
.qhint{font-size:13.5px;color:var(--muted);margin:-4px 0 10px}
.opt{font-size:12px;color:var(--dim);font-weight:600}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;color:var(--muted);font-weight:600}
.tin{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:var(--r-sm);padding:12px 13px;outline:none;transition:.15s;font-size:16px}
.tin::placeholder{color:#5f5a52}
.tin:focus{border-color:var(--gold);background:rgba(0,0,0,.5);box-shadow:0 0 0 3px rgba(201,165,92,.12)}
textarea.tin{min-height:96px;resize:vertical;line-height:1.5}
textarea.tall{min-height:150px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card2);font-size:14.5px;font-weight:600;color:#ddd7cb;transition:.15s}
.chip:hover{border-color:var(--line)}
.chip svg.i{width:15px;height:15px}
.chip.on{border-color:var(--gold);background:rgba(201,165,92,.14);color:var(--gold2)}
.chips+.tin{margin-top:10px}

/* radio cards */
.rcs{display:grid;gap:8px}
.rc{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--card2);transition:.15s;width:100%}
.rc:hover{border-color:var(--line)}
.rc .rt{flex:1;display:flex;flex-direction:column;gap:2px}
.rc .rt b{font-weight:700;font-size:15px}
.rc .rt span{font-size:13.5px;color:var(--muted)}
.ind{width:22px;height:22px;border-radius:50%;border:1.5px solid #4c483f;display:grid;place-items:center;flex:none;transition:.15s}
.ind svg.i{width:13px;height:13px;stroke-width:2.6;opacity:0;color:#16130c}
.rc.on{border-color:var(--gold);background:rgba(201,165,92,.09)}
.rc.on .ind{background:var(--gold);border-color:var(--gold)}
.rc.on .ind svg.i{opacity:1}
.rc .tile{width:38px;height:38px;border-radius:10px}

/* uploads */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:22px 16px;border:1.5px dashed rgba(201,165,92,.35);border-radius:var(--r-sm);background:rgba(201,165,92,.04);transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--gold2);background:rgba(201,165,92,.09)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop .tile{width:40px;height:40px}
.drop b{font-size:15px}
.files{display:grid;gap:8px;margin-top:10px}
.file{display:flex;align-items:center;gap:11px;padding:8px 10px 8px 8px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line2)}
.file .th{width:44px;height:44px;border-radius:8px;flex:none;background:#1b1a17 center/cover;display:grid;place-items:center;color:var(--gold)}
.file .fn{flex:1;min-width:0}
.file .fn b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .fn span{font-size:12.5px;color:var(--muted)}
.file .bar{height:3px;background:var(--line2);border-radius:3px;margin-top:5px;overflow:hidden}
.file .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.file.err .fn span{color:var(--err)}
.xbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.xbtn:hover{background:rgba(255,255,255,.06);color:var(--ink)}

/* logo preview */
.logoprev{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.logoprev img{width:150px;height:auto;border-radius:10px;border:1px solid var(--line2);flex:none}
@media (max-width:520px){.logoprev{flex-direction:column;align-items:flex-start}.logoprev img{width:100%}}

/* voice */
.voice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line2)}
.vbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);color:var(--gold2);font-weight:700;font-size:14px;transition:.15s}
.vbtn:hover{background:rgba(201,165,92,.1)}
.vbtn.rec{background:#5c1f18;border-color:#e0715f;color:#ffd9d1}
.vbtn.rec .rd{width:9px;height:9px;border-radius:50%;background:#ff7a66;animation:pulse 1s infinite}
.vtime{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted)}
.notebtn{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;font-weight:600;padding:9px 6px}
.notebtn:hover{color:var(--ink)}
.notearea{width:100%;margin-top:4px}

/* votes (rozsah) */
.vrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}
.vrow:first-child{border-top:0;padding-top:2px}
.vrow .vt{flex:1;min-width:0}
.vrow .vt b{font-weight:700;font-size:15px;display:block}
.vrow .vt span{font-size:13.5px;color:var(--muted)}
.seg{display:flex;background:rgba(0,0,0,.4);border:1px solid var(--line2);border-radius:999px;padding:3px;flex:none}
.seg button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);transition:.15s}
.seg button.on{background:var(--gold);color:#16130c}
.seg button.on.n{background:#3a3833;color:#d8d2c5}
@media (max-width:560px){.vrow{flex-direction:column;align-items:stretch;gap:8px}.seg{align-self:flex-start}}

/* intro */
.hero{padding:6px 0 4px}
.hero h1 span{color:var(--gold)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.fact{padding:14px;border-radius:var(--r-sm);background:var(--card2);border:1px solid var(--line2)}
.fact svg.i{color:var(--gold);margin-bottom:6px}
.fact b{display:block;font-size:14.5px}
.fact span{font-size:13px;color:var(--muted)}
@media (max-width:560px){.facts{grid-template-columns:1fr}}
.steplist{display:grid;gap:2px;margin-top:6px}
.sl{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:10px;text-align:left;width:100%;color:#d9d3c7}
.sl:hover{background:rgba(255,255,255,.04)}
.sl .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;border:1px solid var(--line);color:var(--gold2);flex:none}
.sl .n.ok{background:var(--gold);color:#16130c;border-color:var(--gold)}
.sl .st{display:flex;flex-direction:column;min-width:0}
.sl .st small{color:var(--dim);font-size:12.5px;line-height:1.35}

/* summary */
.todo{display:grid;gap:6px}
.td{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--line2);text-align:left;width:100%;font-size:14.5px}
.td .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid #4c483f;color:transparent}
.td .ic svg.i{width:13px;height:13px;stroke-width:2.6}
.td.ok .ic{background:var(--ok);border-color:var(--ok);color:#0b1a0e}
.td small{margin-left:auto;color:var(--gold2);font-weight:700;font-size:12.5px;white-space:nowrap}
.td.ok small{color:var(--dim);font-weight:600}
.sent{display:flex;align-items:center;gap:14px}
.sent .tile{color:#0b1a0e;background:var(--ok);border-color:var(--ok)}

/* buttons + nav */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 20px;border-radius:999px;font-weight:700;font-size:15.5px;transition:.15s;white-space:nowrap}
.btn-p{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#16130c;box-shadow:0 6px 24px -8px rgba(201,165,92,.55)}
.btn-p:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn-p:disabled{opacity:.6;transform:none}
.btn-g{border:1px solid var(--line2);color:#d9d3c7}
.btn-g:hover{border-color:var(--line)}
.btn-sm{padding:9px 14px;font-size:14px}
.stnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.mnav{display:none}
@media (max-width:640px){
  .stnav{display:none}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(10,10,9,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line2)}
  .mnav .btn{flex:1;padding:13px 10px}
  .mnav .btn-g{flex:0 0 auto}
  .grid2{grid-template-columns:1fr}
}
.foot{margin-top:40px;text-align:center;font-size:12.5px;color:var(--dim)}
.foot a{color:var(--muted);text-decoration:none}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1d1b17;border:1px solid var(--line);color:var(--ink);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;transition:.25s;z-index:50;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- /odpovedi ---------- */
.ans h3{font-family:var(--disp);font-size:19px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ans h3 .tile{width:34px;height:34px;border-radius:9px}
.ans h3 .tile svg.i{width:17px;height:17px}
.kv{display:grid;grid-template-columns:minmax(120px,38%) 1fr;gap:4px 16px;padding:9px 0;border-top:1px solid var(--line2);font-size:14.5px}
.kv:first-of-type{border-top:0}
.kv dt{color:var(--muted)}
.kv dd{white-space:pre-wrap;word-break:break-word}
.kv dd.empty{color:var(--dim)}
@media (max-width:520px){.kv{grid-template-columns:1fr}}
.agal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.ag{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.35);border:1px solid var(--line2);text-decoration:none;color:var(--ink)}
.ag .im{aspect-ratio:4/3;background:#1b1a17 center/cover;display:grid;place-items:center;color:var(--gold)}
.ag .im svg.i{width:28px;height:28px}
.ag span{font-size:12.5px;padding:7px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag small{font-size:11.5px;color:var(--dim);padding:0 9px 8px}
.aud{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.aud audio{width:100%;height:38px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--card2);border:1px solid var(--line2);color:var(--muted)}
.pill.g{color:#0b1a0e;background:var(--ok);border-color:var(--ok)}
.pill.y{color:var(--gold2);border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.ver{border-top:1px solid var(--line2);padding:10px 0}
details.ver summary{cursor:pointer;font-weight:600;font-size:14.5px}
.stack>*+*{margin-top:12px}
</style>
</head>

const LKEY='jantrex-podklady-v1';
const D0=()=>({a:{nazev:'JANTREX realizace s.r.o.',email:'info@jantrex.cz',domena:'jantrex.cz',registrator:'Active24',barvy:'',faze:{web:'ted'}},notes:{},files:[],sentAt:null,updatedAt:null});
let S=D0(),step=0;
try{const r=localStorage.getItem(LKEY);if(r){const d=JSON.parse(r);S=Object.assign(D0(),d.S||{});S.a=Object.assign(D0().a,S.a);step=d.step||0}}catch(e){}
let A=S.a;
function setA(k,v){A[k]=v;save()}
let saveT=null;
function persistLocal(){try{localStorage.setItem(LKEY,JSON.stringify({S,step}))}catch(e){}}
function save(remote=true){if(remote)S.updatedAt=new Date().toISOString();persistLocal();if(!remote)return;
  clearTimeout(saveT);saveUI('busy','Ukládám…');saveT=setTimeout(()=>push(false),800)}
async function push(justSent){
  try{const r=await fetch('/api/podklady',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({},S,{justSent}))});
    if(!r.ok)throw 0;saveUI('ok','Uloženo');return true}
  catch(e){saveUI('bad','Neuloženo, zkontroluj internet');return false}}
function saveUI(cls,t){document.querySelectorAll('.savest').forEach(el=>{el.className='savest '+cls;el.innerHTML=`<span class="dot"></span>${t}`})}
async function syncRemote(){try{const r=await fetch('/api/podklady',{cache:'no-store'});if(!r.ok)return;const d=await r.json();
  if(!d||!d.updatedAt)return;if(S.updatedAt&&d.updatedAt<=S.updatedAt)return;
  S=Object.assign(D0(),d);S.a=Object.assign(D0().a,d.a||{});A=S.a;persistLocal();saveUI('ok','Načteno');render()}catch(e){}}

function qField(q){
  const v=A[q.k];const optTag=q.opt?'<span class="opt">Nepovinné</span>':'';
  if(q.type==='text')return `<label class="fld ${q.half?'half':''}"><span>${q.label}${q.opt?' · nepovinné':''}</span><input class="tin" data-k="${q.k}" value="${esc(v||'')}" placeholder="${esc(q.ph||'')}" ${q.inputmode?`inputmode="${q.inputmode}"`:''} autocomplete="off"></label>`;
  const head=`<div class="qh"><span class="ql">${q.label}</span>${optTag}</div>${q.hint?`<p class="qhint">${q.hint}</p>`:''}`;
  if(q.type==='area')return `<div class="card q">${head}<textarea class="tin ${q.small?'':'tall'}" data-k="${q.k}" placeholder="${esc(q.ph||'')}">${esc(v||'')}</textarea></div>`;
  if(q.type==='chips'){const arr=v||[];return `<div class="card q">${head}<div class="chips">${q.opts.map(o=>`<button class="chip ${arr.includes(o)?'on':''}" data-chip="${q.k}" data-v="${esc(o)}" aria-pressed="${arr.includes(o)}">${arr.includes(o)?ic('check'):''}${esc(o)}</button>`).join('')}</div>
    ${q.other?`<input class="tin" data-k="${q.other}" value="${esc(A[q.other]||'')}" placeholder="${esc(q.otherPh||'Jiné')}">`:''}</div>`}
  if(q.type==='radio')return `<div class="card q">${head}<div class="rcs" ${q.inline?'style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr))"':''}>${q.opts.map(([val,t,d])=>`<button class="rc ${v===val?'on':''}" role="radio" aria-checked="${v===val}" data-radio="${q.k}" data-v="${val}"><span class="ind">${ic('check')}</span><span class="rt"><b>${t}</b>${d?`<span>${d}</span>`:''}</span></button>`).join('')}</div></div>`;
  if(q.type==='files')return `<div class="card q">${head}${dropHTML(q)}</div>`;
  if(q.type==='logo'){return `<div class="card q"><div class="qh"><span class="ql">Logo, které od tebe mám</span></div>
    <div class="logoprev"><img src="/logo-jantrex.jpg" alt="Logo JANTREX na černém mramoru"><p class="cap">Tohle je obrázek, který jsi mi poslal. Na web potřebuju logo jako soubor bez pozadí. Pokud ho nemáš, připravím ho podle tohohle.</p></div>
    <div class="rcs">${[['ok','Tohle logo chci, jen ho připrav na web',''],['upravit','Chci ho trochu upravit','Napiš nebo nakresli jak.'],['mam','Mám ho i v jiném formátu, nahraju ho níž','']].map(([val,t,d])=>`<button class="rc ${v===val?'on':''}" role="radio" aria-checked="${v===val}" data-radio="logo" data-v="${val}"><span class="ind">${ic('check')}</span><span class="rt"><b>${t}</b>${d?`<span>${d}</span>`:''}</span></button>`).join('')}</div></div>`}
  if(q.type==='votes'){const cur=A[q.k]||{};return `<div class="card q">${head}${q.items.map(([id,t,d])=>`<div class="vrow"><div class="vt"><b>${t}</b>${d?`<span>${d}</span>`:''}</div>
    <div class="seg" role="group" aria-label="${esc(t)}">${[['ted','Teď'],['pozdeji','Později'],['ne','Nechci']].map(([val,l])=>`<button class="${cur[id]===val?'on':''} ${val==='ne'?'n':''}" data-vote="${q.k}" data-id="${id}" data-v="${val}" aria-pressed="${cur[id]===val}">${l}</button>`).join('')}</div></div>`).join('')}</div>`}
  return '';
}
function stepFields(s){
  // textová pole po dvou vedle sebe v jedné kartě, ostatní každé zvlášť
  let out='',buf=[];
  const flush=()=>{if(buf.length){out+=`<div class="card q"><div class="grid2">${buf.map(q=>q.half?qField(q):`<div style="grid-column:1/-1">${qField(q)}</div>`).join('')}</div></div>`;buf=[]}};
  s.q.forEach(q=>{if(q.type==='text')buf.push(q);else{flush();out+=qField(q)}});flush();return out;
}

/* co je vyplněné (pro stepper a shrnutí) */
function filled(q){const v=A[q.k];
  if(q.type==='files')return S.files.some(f=>f.krok===q.krok&&f.id);
  if(q.type==='chips')return (v&&v.length)||(q.other&&A[q.other]);
  if(q.type==='votes')return v&&Object.keys(v).length>1;
  return v!=null&&String(v).trim()!=='';}
function stepFilled(id){const s=STEP_BY_ID[id];if(!s||!s.q)return false;const req=s.q.filter(q=>!q.opt);return req.length?req.every(filled):s.q.some(filled)}

    <p class="cap" style="margin-top:10px">Nemusí být všechno. Co chybí, doladíme po telefonu.</p></div>
   <div class="card q"><div class="qh"><span class="ql">Ještě něco na závěr?</span><span class="opt">Nepovinné</span></div><textarea class="tin" data-notek="odeslat" placeholder="Cokoliv, co se nikam nevešlo">${esc(S.notes.odeslat||'')}</textarea>
    <div class="voice"><button class="vbtn" data-rec="odeslat">${ic('mic')}Nahrát hlasovku</button><span class="vtime" id="vt-odeslat"></span></div>
    <div class="files" data-list="odeslat-hlasovka">${S.files.filter(f=>f.krok==='odeslat-hlasovka').map(fileHTML).join('')}</div></div>
   <div class="card" id="sendBox">${S.sentAt?sentHTML():`<p class="cap" style="margin-bottom:14px">Odesláním mi dáš vědět, že je hotovo. Soubory už mám, nahrály se průběžně. Když pak něco změníš, stačí odeslat znovu.</p><button class="btn btn-p" id="sendBtn">${ic('send')}Odeslat podklady</button>`}</div>`}
const sentHTML=()=>`<div class="sent"><span class="tile">${ic('check')}</span><div style="flex:1"><p class="ql">Odesláno ${new Date(S.sentAt).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}</p><p class="cap">Díky, ozvu se. Když něco doplníš, odešli to znovu.</p></div><button class="btn btn-g btn-sm" id="sendBtn">Odeslat znovu</button></div>`;

function render(){
  if(location.pathname.replace(/\/+$/,'')==='/odpovedi')return renderAnswers();
  const s=STEPS[step];const last=step===STEPS.length-1;
  $('#app').innerHTML=`<div class="top"><a class="mark" href="/" aria-label="JANTREX">JANTRE<b>X</b></a><span class="savest"></span></div>
   <nav class="stepper" aria-label="Kroky"><div class="stp-in">${STEPS.map((x,i)=>`<button class="stp ${i===step?'active':''} ${i!==step&&(stepFilled(x.id)||(x.id==='odeslat'&&S.sentAt))?'done':''}" data-go="${i}" ${i===step?'aria-current="step"':''}><span class="stp-n">${i!==step&&(stepFilled(x.id)||(x.id==='odeslat'&&S.sentAt))?ic('check'):i===0?ic('spark'):i}</span>${x.t}</button>`).join('')}</div>
    <div class="stp-bar"><b style="width:${step/(STEPS.length-1)*100}%"></b></div></nav>
   <main class="step" id="main">
    ${step===0?intro():`<div class="sthead"><span class="tile">${ic(s.i)}</span><div><p class="kicker">Krok ${step} z ${STEPS.length-1}</p><h2>${s.id==='odeslat'?'Shrnutí a odeslání':s.t}</h2>${s.lead?`<p class="lead">${s.lead}</p>`:''}</div></div>
      ${s.q?stepFields(s)+noteVoiceHTML(s.id):summary()}`}
    <div class="stnav">${step?`<button class="btn btn-g" data-go="${step-1}">${ic('back')}Zpět</button>`:'<span></span>'}${last?'':`<button class="btn btn-p" data-go="${step+1}">${step?'Pokračovat':'Jdeme na to'}${ic('arrow')}</button>`}</div>
   </main>
   <div class="mnav">${step?`<button class="btn btn-g" data-go="${step-1}" aria-label="Zpět">${ic('back')}</button>`:''}${last?`<button class="btn btn-p" data-send-scroll>${ic('send')}${S.sentAt?'Odeslat znovu':'Odeslat podklady'}</button>`:`<button class="btn btn-p" data-go="${step+1}">${step?'Pokračovat':'Jdeme na to'}${ic('arrow')}</button>`}</div>
   <p class="foot">Web připravuje <a href="https://vojtechsvoboda.cz" target="_blank" rel="noopener">vojtechsvoboda.cz</a></p>`;
  saveUI(S.updatedAt?'ok':'', S.updatedAt?'Uloženo':'');
  const a=$('.stp.active');if(a){const n=a.parentElement;n.scrollLeft=a.offsetLeft-n.offsetLeft-n.clientWidth/2+a.offsetWidth/2}
  bind();
}
function go(i){step=Math.max(0,Math.min(STEPS.length-1,i));persistLocal();render();
  scrollTo({top:0,behavior:'smooth'})}

/* =========================================================
   Interakce
   ========================================================= */
function bind(){
  const m=$('#app');
  m.querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>setA(el.dataset.k,el.value));
  m.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const k=b.dataset.chip,v=b.dataset.v;const arr=(A[k]||[]).slice();const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);setA(k,arr);
    const on=arr.includes(v);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.innerHTML=(on?ic('check'):'')+esc(v)});
  m.querySelectorAll('[data-radio]').forEach(b=>b.onclick=()=>{const k=b.dataset.radio;const v=A[k]===b.dataset.v?'':b.dataset.v;setA(k,v);
    b.parentElement.querySelectorAll('.rc').forEach(x=>{const on=x.dataset.v===v;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)})});
  m.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>{const k=b.dataset.vote;const cur=Object.assign({},A[k]||{});cur[b.dataset.id]=cur[b.dataset.id]===b.dataset.v?undefined:b.dataset.v;if(!cur[b.dataset.id])delete cur[b.dataset.id];setA(k,cur);
    b.parentElement.querySelectorAll('button').forEach(x=>{const on=cur[b.dataset.id]===x.dataset.v;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)})});
  m.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{const t=m.querySelector(`[data-notek="${b.dataset.note}"]`);t.hidden=!t.hidden;if(!t.hidden)t.focus()});
  m.querySelectorAll('[data-notek]').forEach(t=>t.oninput=()=>{S.notes[t.dataset.notek]=t.value;save()});
  m.querySelectorAll('[data-up]').forEach(inp=>inp.onchange=()=>{uploadAll([...inp.files],inp.dataset.up,!!inp.dataset.compress);inp.value=''});
  m.querySelectorAll('[data-drop]').forEach(d=>{
    d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
    d.ondrop=e=>{e.preventDefault();d.classList.remove('over');const inp=d.querySelector('input');uploadAll([...e.dataTransfer.files],d.dataset.drop,!!inp.dataset.compress)}});
  m.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>toggleRec(b));
  const sb=$('#sendBtn');if(sb)sb.onclick=send;
  const ss=m.querySelector('[data-send-scroll]');if(ss)ss.onclick=send;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b&&!location.pathname.startsWith('/odpovedi')){e.preventDefault();go(+b.dataset.go)}
  const d=e.target.closest('[data-del]');if(d)delFile(d.dataset.del)});

async function send(){
  document.querySelectorAll('#sendBtn,[data-send-scroll]').forEach(b=>b.disabled=true);
  if(uploading>0){toast('Počkej, ještě se nahrávají soubory');document.querySelectorAll('#sendBtn,[data-send-scroll]').forEach(b=>b.disabled=false);return}
  clearTimeout(saveT);S.sentAt=new Date().toISOString();S.updatedAt=S.sentAt;persistLocal();
  const ok=await push(true);
  if(!ok){S.sentAt=null;persistLocal();toast('Nepodařilo se odeslat. Zkontroluj internet a zkus to znovu.');render();return}
  toast('Odesláno, díky!');render();
}

/* ---------- nahrávání souborů ---------- */
let uploading=0;
async function compressImg(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)||file.size<2.5e6)return file;
  try{const bmp=await createImageBitmap(file);const max=2560;const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.86));if(!blob||blob.size>=file.size)return file;
    return new File([blob],file.name.replace(/\.(png|webp)$/i,'.jpg'),{type:'image/jpeg'})}catch(e){return file}}
function uploadAll(files,krok,compress){files.forEach(f=>uploadOne(f,krok,compress))}
async function uploadOne(file,krok,compress){
  const tmp='t'+Math.random().toString(36).slice(2);
  const rec={tmp,name:file.name||'soubor',size:file.size,type:file.type,krok};
  if(isImg(file.type))thumbs[tmp]=URL.createObjectURL(file);
  if(file.size>24*1024*1024){rec.err='Větší než 24 MB, pošli ho prosím přes WeTransfer nebo Úschovnu';S.files.push(rec);redrawList(krok);return}
  S.files.push(rec);redrawList(krok);uploading++;
  if(compress)file=await compressImg(file);rec.size=file.size;
  const xhr=new XMLHttpRequest();
  xhr.open('POST',`/api/soubor?name=${encodeURIComponent(rec.name)}&krok=${encodeURIComponent(krok)}`);
  xhr.setRequestHeader('content-type',file.type||'application/octet-stream');
  xhr.upload.onprogress=e=>{const bar=document.querySelector(`[data-fid="${tmp}"] .bar i`);if(bar&&e.lengthComputable)bar.style.width=(e.loaded/e.total*100)+'%'};
  xhr.onload=()=>{uploading--;let d={};try{d=JSON.parse(xhr.responseText)}catch(e){}
    if(xhr.status===200&&d.id){rec.id=d.id;rec.size=d.size;delete rec.tmp;if(thumbs[tmp]){thumbs[d.id]=thumbs[tmp]}save()}
    else rec.err=d.error||'Nahrání se nepovedlo, zkus to znovu';redrawList(krok)};
  xhr.onerror=()=>{uploading--;rec.err='Nahrání se nepovedlo, zkontroluj internet';redrawList(krok)};
  xhr.send(file);
}
function redrawList(krok){const el=document.querySelector(`[data-list="${krok}"]`);if(el)el.innerHTML=S.files.filter(f=>f.krok===krok).map(fileHTML).join('')}
async function delFile(fid){const f=S.files.find(x=>x.id===fid||x.tmp===fid);if(!f)return;
  S.files=S.files.filter(x=>x!==f);save();redrawList(f.krok);
  if(f.id)try{await fetch('/api/soubor?id='+encodeURIComponent(f.id),{method:'DELETE'})}catch(e){}}

/* ---------- hlasovky ---------- */
let mr=null,chunks=[],recStart=0,recTimer=null,recBtn=null;
async function toggleRec(b){
  if(mr&&mr.state==='recording'){mr.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Tenhle prohlížeč neumí nahrávat. Nahraj hlasovku v telefonu a přidej ji jako soubor.');return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast('Bez přístupu k mikrofonu to nepůjde. Povol ho v prohlížeči.');return}
  const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  mr=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];recBtn=b;const id=b.dataset.rec;
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(recTimer);
    const mime=(mr.mimeType||type||'audio/webm').split(';')[0];const ext=mime.includes('mp4')?'m4a':'webm';
    const blob=new Blob(chunks,{type:mime});const secs=Math.round((Date.now()-recStart)/1000);
    b.classList.remove('rec');b.innerHTML=ic('mic')+'Nahrát další hlasovku';const vt=$('#vt-'+id);if(vt)vt.textContent='';
    if(blob.size<1500){toast('Nahrávka je moc krátká');return}
    const stepName=(STEP_BY_ID[id]||{}).t||id;
    const name=`Hlasovka ${stepName} ${new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'})} (${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}).${ext}`;
    uploadOne(new File([blob],name,{type:mime}),id+'-hlasovka',false)};
  mr.start(1000);recStart=Date.now();b.classList.add('rec');b.innerHTML='<span class="rd"></span>Zastavit a uložit';
  recTimer=setInterval(()=>{const s=Math.round((Date.now()-recStart)/1000);const vt=$('#vt-'+id);if(vt)vt.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;if(s>=600)mr.stop()},500);
}

/* =========================================================
   /odpovedi (jen pro Vojtu, s heslem)
   ========================================================= */
const PKEY='jantrex-odpovedi-heslo';
let ANS=null;
function fmtVal(q,a){const v=a[q.k];
  if(q.type==='chips'){const arr=(v||[]).slice();if(q.other&&a[q.other])arr.push(a[q.other]);return arr.join(', ')}
  if(q.type==='radio'){const o=q.opts.find(o=>o[0]===v);return o?o[1]:''}
  if(q.type==='logo'){return ({ok:'Tohle logo chci, jen ho připrav na web',upravit:'Chci ho trochu upravit',mam:'Mám ho i v jiném formátu'})[v]||''}
  if(q.type==='votes'){const cur=v||{};const L={ted:'Teď',pozdeji:'Později',ne:'Nechci'};return q.items.filter(([id])=>cur[id]).map(([id,t])=>`${L[cur[id]]}: ${t}`).join('\n')}
  return v||''}
function renderAnswers(){
  const pw=localStorage.getItem(PKEY)||'';
  if(!ANS){
    $('#app').innerHTML=`<div class="top"><a class="mark" href="/">JANTRE<b>X</b></a><span class="pill">${ic('lock')}Odpovědi</span></div>
     <div class="card" style="max-width:420px;margin:40px auto 0"><span class="tile" style="margin-bottom:12px">${ic('lock')}</span><h2 style="margin-bottom:6px">Odpovědi</h2><p class="cap" style="margin-bottom:14px">Zadej heslo nastavené na Cloudflare (secret HESLO).</p>
      <form id="pwf"><input class="tin" type="password" id="pw" placeholder="Heslo" value="${esc(pw)}" autocomplete="current-password"><button class="btn btn-p" style="margin-top:12px;width:100%">Zobrazit</button><p class="cap" id="pwerr" style="color:var(--err);margin-top:8px"></p></form></div>`;
    $('#pwf').onsubmit=e=>{e.preventDefault();loadAnswers($('#pw').value)};
    if(pw)loadAnswers(pw);return}
  const {current:c,sent,files}=ANS;const a=c.a||{};const notes=c.notes||{};
  const fileUrl=(f,dl)=>`/soubor/${f.id}?k=${encodeURIComponent(localStorage.getItem(PKEY)||'')}${dl?'&stahnout=1':''}`;
  const filesFor=krok=>files.filter(f=>f.krok===krok);
  const gal=list=>{if(!list.length)return '';const au=list.filter(f=>/^audio/.test(f.type)),ot=list.filter(f=>!/^audio/.test(f.type));
    return (au.length?`<div class="aud">${au.map(f=>`<div><p class="cap">${esc(f.name)} · ${fmtSize(f.size)}</p><audio controls preload="none" src="${fileUrl(f)}"></audio></div>`).join('')}</div>`:'')+
     (ot.length?`<div class="agal">${ot.map(f=>`<a class="ag" href="${fileUrl(f)}" target="_blank" rel="noopener"><span class="im" ${/^image\/(jpeg|png|webp|gif)/.test(f.type)?`style="background-image:url('${fileUrl(f)}')"`:''}>${/^image\/(jpeg|png|webp|gif)/.test(f.type)?'':ic('file')}</span><span>${esc(f.name)}</span><small>${fmtSize(f.size)}</small></a>`).join('')}</div>`:'')};
  const known=new Set();
  const sections=FORM_STEPS.map(s=>{
    const rows=s.q.map(q=>{if(q.type==='files'){known.add(q.krok);const l=filesFor(q.krok);return `<div class="kv"><dt>${q.label}</dt><dd class="${l.length?'':'empty'}">${l.length?l.length+' '+(l.length===1?'soubor':l.length<5?'soubory':'souborů'):'Nic'}</dd></div>${gal(l)}`}
      const v=fmtVal(q,a);return `<div class="kv"><dt>${q.label}</dt><dd class="${v?'':'empty'}">${v?esc(v):'Nevyplněno'}</dd></div>`}).join('');
    known.add(s.id+'-hlasovka');const voice=filesFor(s.id+'-hlasovka');
    return `<section class="card ans q"><h3><span class="tile">${ic(s.i)}</span>${s.t}</h3>${rows}
      ${notes[s.id]?`<div class="kv"><dt>Poznámka</dt><dd>${esc(notes[s.id])}</dd></div>`:''}${voice.length?`<div class="kv"><dt>Hlasovky</dt><dd>${voice.length}</dd></div>${gal(voice)}`:''}</section>`}).join('');
  known.add('odeslat-hlasovka');
  const endVoice=filesFor('odeslat-hlasovka');const orphan=files.filter(f=>!known.has(f.krok));
  $('#app').innerHTML=`<div class="top"><a class="mark" href="/">JANTRE<b>X</b></a><div class="row"><button class="btn btn-g btn-sm" id="cp">${ic('copy')}Kopírovat jako text</button><button class="btn btn-g btn-sm" id="rl" aria-label="Načíst znovu">${ic('refresh')}</button></div></div>
   <div class="sthead"><span class="tile">${ic('note')}</span><div><p class="kicker">Odpovědi</p><h2>Podklady od Honzy</h2>
    <div class="row" style="margin-top:8px">${c.sentAt?`<span class="pill g">${ic('check')}Odesláno ${new Date(c.sentAt).toLocaleString('cs-CZ')}</span>`:c.updatedAt?`<span class="pill y">${ic('clock')}Rozpracováno</span>`:'<span class="pill">Zatím nic</span>'}
    ${c.savedAt?`<span class="pill">Naposledy uloženo ${new Date(c.savedAt).toLocaleString('cs-CZ')}</span>`:''}<span class="pill">${files.length} ${files.length===1?'soubor':files.length>1&&files.length<5?'soubory':'souborů'}</span></div></div></div>
   ${sections}
   ${notes.odeslat||endVoice.length?`<section class="card ans q"><h3><span class="tile">${ic('send')}</span>Na závěr</h3>${notes.odeslat?`<div class="kv"><dt>Poznámka</dt><dd>${esc(notes.odeslat)}</dd></div>`:''}${gal(endVoice)}</section>`:''}
   ${orphan.length?`<section class="card ans q"><h3><span class="tile">${ic('file')}</span>Ostatní soubory</h3>${gal(orphan)}</section>`:''}
   <section class="card ans q"><h3><span class="tile">${ic('layers')}</span>Odeslané verze</h3>${sent.length?sent.map(v=>`<details class="ver"><summary>${new Date(v.at).toLocaleString('cs-CZ')}</summary><pre style="white-space:pre-wrap;font-size:12.5px;color:var(--muted);margin-top:8px">${esc(asText(v.data))}</pre></details>`).join(''):'<p class="cap">Zatím nic neodeslal.</p>'}</section>
   <p class="cap" style="text-align:center;margin-top:10px">Soubory smazané Honzou z formuláře se smažou i tady.</p>`;
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(asText(c,files));toast('Zkopírováno')}catch(e){toast('Kopírování se nepovedlo')}};
  $('#rl').onclick=()=>loadAnswers(localStorage.getItem(PKEY)||'');
}
function asText(c,files){const a=c.a||{},n=c.notes||{};let t='JANTREX · podklady k webu\n';
  if(c.sentAt)t+=`Odesláno: ${new Date(c.sentAt).toLocaleString('cs-CZ')}\n`;
  FORM_STEPS.forEach(s=>{t+=`\n## ${s.t}\n`;s.q.forEach(q=>{if(q.type==='files'){const l=(files||c.files||[]).filter(f=>f.krok===q.krok&&f.id);t+=`- ${q.label}: ${l.length?l.map(f=>f.name).join(', '):'nic'}\n`;return}
    const v=fmtVal(q,a);t+=`- ${q.label}: ${v?v.replace(/\n/g,'; '):'—'}\n`});if(n[s.id])t+=`- Poznámka: ${n[s.id]}\n`});
  if(n.odeslat)t+=`\n## Na závěr\n${n.odeslat}\n`;return t}
async function loadAnswers(pw){
  try{const r=await fetch('/api/odpovedi',{headers:{'x-heslo':pw},cache:'no-store'});const d=await r.json().catch(()=>({}));
    if(r.status===401){localStorage.removeItem(PKEY);ANS=null;renderAnswers();const e=$('#pwerr');if(e)e.textContent='Špatné heslo.';return}
    if(!r.ok){const e=$('#pwerr');if(e)e.textContent=d.error||'Nepodařilo se načíst.';return}
    localStorage.setItem(PKEY,pw);ANS=d;renderAnswers()}catch(e){const el=$('#pwerr');if(el)el.textContent='Nepodařilo se načíst.'}}

/* ---------- start ---------- */
render();
if(!location.pathname.startsWith('/odpovedi')){syncRemote();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncRemote()})}
</script>
